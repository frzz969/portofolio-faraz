<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="Terminal log showing MCP and API experiments">
  <rect width="800" height="420" fill="#1E0F75"/>
  <!-- window chrome -->
  <rect x="0" y="0" width="800" height="44" fill="#1C1DAB"/>
  <circle cx="26" cy="22" r="6" fill="#C08CE2"/>
  <circle cx="48" cy="22" r="6" fill="#C08CE2" opacity=".7"/>
  <circle cx="70" cy="22" r="6" fill="#CBD8E8" opacity=".3"/>
  <text x="96" y="28" font-family="ui-monospace, monospace" font-size="13" fill="#CBD8E8" opacity=".6">~/experiments/mcp-fastapi · zsh</text>
  <!-- terminal text -->
  <g font-family="ui-monospace, monospace" font-size="15">
    <text x="28" y="84" fill="#C08CE2">$ python -m server --transport stdio</text>
    <text x="28" y="114" fill="#CBD8E8" opacity=".8">[ok] FastAPI listening on :8000</text>
    <text x="28" y="144" fill="#CBD8E8" opacity=".8">[ok] MCP tools registered: 4</text>
    <text x="28" y="174" fill="#C08CE2">[run] agent.dispatch(task=eval)</text>
    <text x="44" y="204" fill="#CBD8E8" opacity=".65">→ policy.validate() ........ pass</text>
    <text x="44" y="234" fill="#CBD8E8" opacity=".65">→ tool.call(web.search) .... ok</text>
    <text x="44" y="264" fill="#CBD8E8" opacity=".65">→ audit.append(trace) ..... done</text>
    <text x="28" y="306" fill="#CBD8E8">✓ run complete · 3 steps · 0 errors</text>
    <text x="28" y="350" fill="#C08CE2">$ _</text>
  </g>
  <!-- subtle scanlines -->
  <g stroke="#CBD8E8" stroke-opacity=".04">
    <path d="M0 70 H800 M0 130 H800 M0 190 H800 M0 250 H800 M0 310 H800 M0 370 H800"/>
  </g>
