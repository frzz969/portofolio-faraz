<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" fill="none" role="img" aria-label="Monochrome editorial head-and-shoulders portrait illustration">
  <title>Portrait of Faras</title>
  <desc>Editorial monochrome vector portrait, transparent background, no project UI elements.</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
    </filter>
    <clipPath id="frameClip">
      <rect x="0" y="0" width="800" height="1000"/>
    </clipPath>
  </defs>

  <!-- Monochrome editorial portrait, not a project screenshot -->
  <g clip-path="url(#frameClip)">
    <!-- shoulders / torso -->
    <path d="M120 1000 C124 846 206 764 314 738 L486 738 C594 764 676 846 680 1000 Z" fill="#EEEEEE"/>
    <path d="M120 1000 C124 846 206 764 314 738 L346 752 C250 792 190 872 184 1000 Z" fill="#FFFFFF"/>
    <path d="M680 1000 C676 846 594 764 486 738 L454 752 C550 792 610 872 616 1000 Z" fill="#202020"/>
    <path d="M120 1000 C124 846 206 764 314 738 L486 738 C594 764 676 846 680 1000" stroke="#737373" stroke-width="4"/>

    <!-- neck -->
    <path d="M338 636 L462 636 L470 752 C438 776 362 776 330 752 Z" fill="#EEEEEE"/>
    <path d="M338 636 L400 664 L400 768 C374 770 350 762 330 752 Z" fill="#FFFFFF"/>
    <path d="M462 636 L400 664 L400 768 C426 770 450 762 470 752 Z" fill="#202020"/>
    <path d="M338 636 L462 636" stroke="#737373" stroke-width="4"/>

    <!-- ears -->
    <path d="M256 472 C236 462 226 486 234 518 C240 546 256 560 272 552 L272 470 Z" fill="#EEEEEE"/>
    <path d="M544 472 C564 462 574 486 566 518 C560 546 544 560 528 552 L528 470 Z" fill="#EEEEEE"/>
    <path d="M246 488 C238 492 240 516 248 532" stroke="#737373" stroke-width="5" stroke-linecap="round"/>
    <path d="M554 488 C562 492 560 516 552 532" stroke="#737373" stroke-width="5" stroke-linecap="round"/>

    <!-- head / face -->
    <path d="M400 176 C300 176 262 254 262 380 C262 506 316 606 400 640 C484 606 538 506 538 380 C538 254 500 176 400 176 Z" fill="#EEEEEE"/>
    <path d="M400 176 C300 176 262 254 262 380 C262 506 316 606 400 640 Z" fill="#FFFFFF"/>
    <path d="M400 176 C500 176 538 254 538 380 C538 506 484 606 400 640 Z" fill="#202020" opacity="0.55"/>
    <path d="M400 176 C300 176 262 254 262 380 C262 506 316 606 400 640 C484 606 538 506 538 380 C538 254 500 176 400 176 Z" stroke="#737373" stroke-width="4"/>

    <!-- hair -->
    <path d="M256 392 C242 292 268 196 348 162 C424 130 508 158 536 236 C548 272 548 322 540 364 C528 326 512 302 486 288 C452 312 400 320 350 306 C312 296 282 320 266 362 Z" fill="#202020"/>
    <path d="M270 350 C284 280 318 230 372 204 C416 184 470 190 504 222 C466 206 420 212 382 232 C334 256 298 300 282 350 Z" fill="#737373" opacity="0.5"/>
    <path d="M262 380 C262 300 274 240 322 200" stroke="#737373" stroke-width="3" opacity="0.6"/>

    <!-- eyebrows -->
    <path d="M310 382 C330 370 356 370 376 380" stroke="#202020" stroke-width="9" stroke-linecap="round"/>
    <path d="M424 380 C444 370 470 370 490 382" stroke="#202020" stroke-width="9" stroke-linecap="round"/>

    <!-- eyes -->
    <path d="M312 412 C328 398 360 398 376 412 C360 424 328 424 312 412 Z" fill="#F7F7F7" stroke="#737373" stroke-width="3"/>
    <path d="M424 412 C440 398 472 398 488 412 C472 424 440 424 424 412 Z" fill="#F7F7F7" stroke="#737373" stroke-width="3"/>
    <circle cx="344" cy="412" r="9" fill="#202020"/>
    <circle cx="456" cy="412" r="9" fill="#202020"/>
    <circle cx="347" cy="409" r="3" fill="#FFFFFF"/>
    <circle cx="459" cy="409" r="3" fill="#FFFFFF"/>
    <path d="M306 406 C324 392 360 392 382 406" stroke="#737373" stroke-width="3" stroke-linecap="round"/>
    <path d="M418 406 C440 392 476 392 494 406" stroke="#737373" stroke-width="3" stroke-linecap="round"/>

    <!-- nose -->
    <path d="M400 420 C394 452 388 476 380 496 C388 506 412 506 422 496" stroke="#737373" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M400 420 C394 452 388 476 380 496 C386 502 398 504 400 504 Z" fill="#FFFFFF" opacity="0.7"/>

    <!-- mouth -->
    <path d="M358 548 C376 538 424 538 442 548 C424 566 376 566 358 548 Z" fill="#D9D9D9"/>
    <path d="M358 548 C376 540 424 540 442 548" stroke="#202020" stroke-width="4" stroke-linecap="round"/>
    <path d="M368 556 C384 562 416 562 432 556" stroke="#737373" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

    <!-- jaw / cheek contour lines -->
    <path d="M292 470 C298 522 322 566 356 590" stroke="#737373" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <path d="M508 470 C502 522 478 566 444 590" stroke="#737373" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

    <!-- collar detail -->
    <path d="M314 740 L400 812 L486 740" stroke="#737373" stroke-width="4" stroke-linejoin="round"/>
    <path d="M400 812 L400 1000" stroke="#737373" stroke-width="3" opacity="0.7"/>
    <path d="M344 758 L400 812 L456 758" stroke="#202020" stroke-width="3" stroke-linejoin="round" opacity="0.5"/>

    <!-- fine grain overlay -->
    <rect x="0" y="0" width="800" height="1000" filter="url(#grain)" opacity="0.04"/>
  </g>
</svg>
